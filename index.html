      rel="stylesheet"

    <title>ERUPT Creative Group — 360° Creative & Digital Marketing, Kannur</title>
    <style>
      html.intro-pending,
      html.intro-pending body {
        background: #000;
      }
    </style>
    <script>
      (function () {
        // Runs before first paint: mark that the intro should play this session.
        // IntroLoader.jsx reads this class to decide whether to skip.
        try {
          var seen = sessionStorage.getItem('erupt-intro-seen')
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          if (!seen && !reduce) document.documentElement.classList.add('intro-pending')
        } catch (e) {
          // sessionStorage unavailable — play the intro every load
          document.documentElement.classList.add('intro-pending')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
